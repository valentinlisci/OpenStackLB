---
- name: Create L4 TCP Load Balancer using openstack.cloud 2.4.1 
  hosts: localhost
  gather_facts: no
  collections:
    - openstack.cloud

  vars:
    cloud_name: openstack
    lb_name: awx-test-lb-l4-corretto
    lb_vip_subnet: "d126b00a-8fab-48b4-bc55-0f05c6aacc8e"
    listener_name: tcp-listener
    listener_port: 8080
    pool_name: tcp-pool
    lb_algorithm: ROUND_ROBIN
    lb_members:
      - address: 10.0.0.11
        protocol_port: 8080
      - address: 10.0.0.12
        protocol_port: 8080

  tasks:

    # -------------------- NOTIFY: Job started --------------------
    - name:  Notify ManageIQ - Job started
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": " Job AWX avviato: creazione Load Balancer {{ lb_name }}"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes

    # -------------------- CLEANUP --------------------
    - name: Ensure no existing load balancer (cleanup)
      openstack.cloud.loadbalancer:
        cloud: "{{ cloud_name }}"
        name: "{{ lb_name }}"
        state: absent
      ignore_errors: yes

    # -------------------- CREATE LOAD BALANCER --------------------
    - name: Create Load Balancer (Amphora provider assumed)
      openstack.cloud.loadbalancer:
        cloud: "{{ cloud_name }}"
        name: "{{ lb_name }}"
        vip_subnet: "{{ lb_vip_subnet }}"
        state: present
        wait: yes
        timeout: 800

    - name:  Notify ManageIQ - Load Balancer created
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": "✅ Load Balancer {{ lb_name }} creato con successo"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes

    # -------------------- CREATE LISTENER --------------------
    - name: Create TCP Listener
      openstack.cloud.lb_listener:
        cloud: "{{ cloud_name }}"
        load_balancer: "{{ lb_name }}"
        name: "{{ listener_name }}"
        protocol: TCP
        protocol_port: "{{ listener_port }}"
        state: present
        wait: yes
        timeout: 120

    - name:  Notify ManageIQ - Listener created
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": " Listener TCP {{ listener_name }} creato correttamente"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes

    # -------------------- CREATE POOL --------------------
    - name: Create TCP Pool
      openstack.cloud.lb_pool:
        cloud: "{{ cloud_name }}"
        listener: "{{ listener_name }}"
        name: "{{ pool_name }}"
        protocol: TCP
        lb_algorithm: "{{ lb_algorithm }}"
        state: present
        wait: yes
        timeout: 120

    - name:  Notify ManageIQ - Pool created
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": " Pool TCP {{ pool_name }} creato con successo"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes

    # -------------------- ADD MEMBERS --------------------
    - name: Add members to pool
      openstack.cloud.lb_member:
        cloud: "{{ cloud_name }}"
        pool: "{{ pool_name }}"
        name: "member-{{ item.address }}-{{ item.protocol_port }}"
        address: "{{ item.address }}"
        protocol_port: "{{ item.protocol_port }}"
        subnet_id: "{{ lb_vip_subnet }}"
        state: present
      loop: "{{ lb_members }}"

    - name:  Notify ManageIQ - Members added
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": " Membri aggiunti al pool {{ pool_name }}"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes

    # -------------------- FINAL INFO --------------------
    - name: Retrieve Load Balancer info using OpenStack SDK 
      ansible.builtin.command: >
        python3 -c "import openstack, json;
        conn=openstack.connect(cloud='{{ cloud_name }}');
        lb=conn.load_balancer.find_load_balancer('{{ lb_name }}');
        import sys;
        sys.exit(1) if not lb else None;
        full=conn.load_balancer.get_load_balancer(lb);
        print(json.dumps({'name': full.name, 'vip_address': full.vip_address, 'vip_port_id': full.vip_port_id, 'id': full.id}))"
      register: lb_info_json
      changed_when: false
      failed_when: lb_info_json.rc != 0

    - name: Parse SDK output
      ansible.builtin.set_fact:
        lb_data: "{{ lb_info_json.stdout | from_json }}"

    - name: Set output facts for workflow
      ansible.builtin.set_fact:
        lb_output:
          name: "{{ lb_data.name }}"
          vip_port_id: "{{ lb_data.vip_port_id }}"
          vip_address: "{{ lb_data.vip_address }}"
          id: "{{ lb_data.id }}"

    - name: Print LB info for workflow output
      ansible.builtin.debug:
        msg:
          - "✅ Load Balancer creato con successo!"
          - "Nome: {{ lb_output.name }}"
          - "VIP Address: {{ lb_output.vip_address }}"
          - "VIP Port ID: {{ lb_output.vip_port_id }}"

    # -------------------- NOTIFY: Job completed --------------------
    - name:  Notify ManageIQ - Job completed
      uri:
        url: "https://172.16.0.174/api/automation_requests"
        method: POST
        user: "admin"
        password: "smartvm"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "version": "1.1",
            "uri_parts": {
              "namespace": "Custom/System",
              "class": "Request",
              "instance": "test"
            },
            "parameters": {
              "message": " ✅ Workflow completato con successo per Load Balancer {{ lb_name }}"
            },
            "requester": {
              "auto_approve": true
            }
          }
      ignore_errors: yes
